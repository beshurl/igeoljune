spring:
  application:
    name: ikgeoljune-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ikgeoljune}
    username: ${DB_USERNAME:ikgeoljune}
    password: ${DB_PASSWORD:ikgeoljune}
    driver-class-name: org.postgresql.Driver

  # 스키마는 Flyway(db/migration)가 소유한다. 엔티티를 바꿨다면 새 마이그레이션을 추가할 것.
  flyway:
    enabled: true
    baseline-on-migrate: false   # 이전 스키마가 남은 DB 에서는 실행을 거부하게 둔다

  jpa:
    hibernate:
      ddl-auto: validate   # Hibernate 는 검증만 한다. 스키마 변경은 Flyway 로만.
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

  servlet:
    multipart:
      # KAKAO-001: 초과 시 413 (§1.4)
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    # 운영 배포 전 반드시 JWT_SECRET 환경변수로 교체 (HS256 최소 32byte)
    secret: ${JWT_SECRET:ikgeoljune-dev-only-secret-change-me-please-32bytes-min}
    # §3 AUTH-002 expiresIn(초)과 동일한 값을 사용한다
    expires-in-seconds: ${JWT_EXPIRES_IN:3600}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai:
    # mock: 내부 Mock AI 사용 (실제 LLM 연동 시 provider 추가 후 교체)
    provider: ${AI_PROVIDER:mock}
    candidate-count: 5
    # Mock AI가 흉내내는 처리 지연(ms). RECOMMEND-001 이 202 PROCESSING 을 먼저 반환하는 흐름 확인용
    mock-latency-ms: ${AI_MOCK_LATENCY_MS:800}
  kakao-analysis:
    max-file-size-bytes: 5242880
    allowed-extensions: txt,csv

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
