    FeedbackType:
      type: string
      enum: [LIKE, DISLIKE]

    FeedbackUpsertRequest:
      type: object
      required: [feedbackType]
      additionalProperties: false
      description: LIKE 이면 dislikeReason 을 무시하고 null 로 저장합니다. DISLIKE 이면 선택적으로 입력합니다.
      properties:
        feedbackType:
          $ref: '#/components/schemas/FeedbackType'
        dislikeReason:
          type: string
          nullable: true
          description: 프론트는 자유 입력 없이 이 8개 코드만 전송합니다. 값이 없으면 null 입니다.
          enum:
            - TASTE_MISMATCH
            - ALREADY_OWNED
            - SIMILAR_TO_PREVIOUS
            - TOO_BURDENSOME
            - NOT_PRACTICAL
            - PRICE_INAPPROPRIATE
            - WANT_DIFFERENT_STYLE
            - OTHER
            - null

