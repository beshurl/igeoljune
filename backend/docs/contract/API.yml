openapi: 3.0.3
info:
  title: 이걸주네? API
  version: 2.0.0
  description: |
    AI 맞춤형 선물 추천 서비스의 MVP REST API 명세입니다.
    일반 이메일·비밀번호 회원가입과 로그인을 사용합니다.
    카카오톡 원문은 분석 중에만 임시 처리하고 영구 저장하지 않습니다.
    핵심 흐름은 대상·조건 입력 → AI 추천 → 결과 조회 → 피드백 → 재추천 → 최종 선물 선택입니다.

    이 문서는 `backend` 구현(컨트롤러·DTO·Flyway 마이그레이션)을 그대로 옮긴 것입니다.
    구현과 어긋나는 부분을 발견하면 코드가 아니라 이 문서를 먼저 고칩니다.

    응답 직렬화 규칙: Jackson `default-property-inclusion: always` 이므로
    값이 없는 필드도 키가 항상 포함되며 `null` 로 내려갑니다.
    요청 본문은 `fail-on-unknown-properties: true` 이므로 정의되지 않은 필드를 보내면 400 입니다.
  contact:
    name: 이걸주네? 프로젝트 팀
    url: https://github.com/beshurl/igeoljune
  license:
    name: All rights reserved
    url: https://github.com/beshurl/igeoljune

servers:
  - url: /
    description: 배포 호스트에 상대 경로로 적용
  - url: http://127.0.0.1:8080
    description: 로컬 Application API
  - url: http://127.0.0.1:4010
    description: Prism 정적 응답 Mock API

x-mock-command: npx --yes @stoplight/prism-cli mock docs/contract/API.yml --host 127.0.0.1 --port 4010 --errors
x-core-flow: 대상 등록 → 추천 조건 입력 → AI 추천 요청 → 추천 결과 조회 → 후보 피드백 → 재추천 → 최종 선물 선택
x-ai-contract:
  processing: synchronous
  note: |
    MVP 는 Mock AI 를 요청 스레드 안에서 실행하고 후보까지 채운 201 을 즉시 반환합니다.
    프론트는 PROCESSING 을 폴링하지 않습니다.
    recommendations.status 컬럼과 RecommendationStatus 는 실제 LLM 연동 시
    비동기 + 폴링으로 전환할 자리를 남겨 둔 것이며, 현재는 생성 직후부터 SUCCESS 입니다.
  input-sources: [recipient, structured_preference, previous_gifts, gift_conditions, feedback]
  output-schema: GiftCandidate
  output-fields: [giftName, giftCategory, estimatedPriceMin, estimatedPriceMax, recommendationReason, consideredInfo, cautionNote, recommendRank]
  candidate-count: 5
  success-response: 201 RecommendationDetail
  failure-response: 422 ErrorResponse (code=AI_RESULT_INVALID)
x-error-contract:
  schema: ErrorResponse
  codes:
    VALIDATION_ERROR: 400
    UNAUTHORIZED: 401
    RESOURCE_FORBIDDEN: 403
    RESOURCE_NOT_FOUND: 404
    METHOD_NOT_ALLOWED: 405
    RESOURCE_CONFLICT: 409
    PAYLOAD_TOO_LARGE: 413
    UNSUPPORTED_MEDIA_TYPE: 415
    AI_RESULT_INVALID: 422
    INTERNAL_ERROR: 500
  source: com.skala.ikgeoljune.common.ErrorCode
x-field-naming:
  api-and-ai: camelCase
  database: snake_case
  rule: 같은 의미의 필드는 아래 명시적 매핑을 사용하며 AI 출력명과 API 응답명은 완전히 동일하게 유지합니다.
  mappings:
    giftName: recommendation_candidates.gift_name
    giftCategory: recommendation_candidates.gift_category
    estimatedPriceMin: recommendation_candidates.estimated_price_min
    estimatedPriceMax: recommendation_candidates.estimated_price_max
    recommendationReason: recommendation_candidates.recommendation_reason
    consideredInfo: recommendation_candidates.considered_info
    cautionNote: recommendation_candidates.caution_note
    recommendRank: recommendation_candidates.recommend_rank
    selectedAt: recommendation_candidates.selected_at
