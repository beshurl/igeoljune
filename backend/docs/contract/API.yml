tags:
  - name: Auth
    description: 이메일 회원가입·로그인
  - name: User
    description: 현재 사용자 관리
  - name: Recipient
    description: 선물 대상 관리
  - name: Preference
    description: 구조화 취향 관리
  - name: KakaoAnalysis
    description: 카카오톡 대화 파일 임시 분석
  - name: PreviousGift
    description: 대상별 과거 선물 관리
  - name: GiftCondition
    description: 추천 조건 관리
  - name: Recommendation
    description: AI 추천·재추천
  - name: Feedback
    description: 후보별 현재 피드백
  - name: CandidateSelection
    description: 최종 선물 선택

security:
  - bearerAuth: []

paths:
  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: AUTH-001 이메일 회원가입
      operationId: signUp
      security: []
      x-uc-id: UC1
      x-req-id: REQ-F-001
      x-screen-id: SCR-AUTH-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              email: user@example.com
              password: password123!
              name: 홍길동
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: AUTH-002 이메일·비밀번호 로그인
      operationId: login
      security: []
      x-uc-id: UC1
      x-req-id: REQ-F-001
      x-screen-id: SCR-AUTH-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: password123!
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: UNAUTHORIZED
                message: 이메일 또는 비밀번호가 올바르지 않습니다.
                fieldErrors: []
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/users/me:
    get:
      tags: [User]
      summary: USER-001 내 정보 조회
      operationId: getMe
      x-uc-id: UC1
      x-req-id: REQ-F-001
      x-screen-id: SCR-AUTH-001
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [User]
      summary: USER-002 내 이름 수정
      operationId: updateMe
      x-uc-id: UC1
      x-req-id: REQ-F-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [User]
      summary: USER-003 회원 탈퇴
      description: 사용자와 소유한 추천 대상 및 하위 개인 데이터를 함께 삭제합니다.
      operationId: deleteMe
      x-uc-id: UC1
      x-req-id: REQ-F-001
      responses:
        '204':
          description: 탈퇴 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/recipients:
    post:
      tags: [Recipient]
      summary: RECIPIENT-001 추천 대상 등록
      operationId: createRecipient
      x-uc-id: UC2
      x-req-id: REQ-F-002
      x-screen-id: SCR-RECIPIENT-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Recipient]
      summary: RECIPIENT-002 추천 대상 목록 조회
      description: totalCount 는 현재 페이지가 아니라 전체 건수입니다.
      operationId: listRecipients
      x-uc-id: UC2
      x-req-id: REQ-F-002
      x-screen-id: SCR-RECIPIENT-001
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/recipients/{recipientId}:
    parameters:
      - $ref: '#/components/parameters/RecipientId'
    get:
      tags: [Recipient]
      summary: RECIPIENT-003 추천 대상 상세 조회
      operationId: getRecipient
      x-uc-id: UC2
      x-req-id: REQ-F-002
      x-screen-id: SCR-RECIPIENT-001
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [Recipient]
      summary: RECIPIENT-004 추천 대상 수정
      description: 보낸 필드만 수정합니다. 최소 한 개 이상 보내야 합니다.
      operationId: updateRecipient
      x-uc-id: UC2
      x-req-id: REQ-F-002
      x-screen-id: SCR-RECIPIENT-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Recipient]
      summary: RECIPIENT-005 추천 대상 삭제
      description: 대상의 취향·과거 선물·추천 조건과 그 하위 데이터가 함께 삭제됩니다.
      operationId: deleteRecipient
      x-uc-id: UC2
      x-req-id: REQ-F-002
      x-screen-id: SCR-RECIPIENT-001
      responses:
        '204':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/recipients/{recipientId}/preferences:
    parameters:
      - $ref: '#/components/parameters/RecipientId'
    post:
      tags: [Preference]
      summary: PREF-001 직접 입력 취향 등록
      description: sourceType 은 서버에서 DIRECT 로 설정합니다.
      operationId: createPreference
      x-uc-id: UC3
      x-req-id: REQ-F-003
      x-screen-id: SCR-GIFT-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredPreference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 같은 대상에 같은 (preferenceType, preferenceValue) 가 이미 있음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: RESOURCE_CONFLICT
                message: 이미 등록된 취향입니다.
                fieldErrors: []
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Preference]
      summary: PREF-003 취향 목록 조회
      operationId: listPreferences
      x-uc-id: UC3,UC6
      x-req-id: REQ-F-003,REQ-F-006
      x-screen-id: SCR-GIFT-001,SCR-KAKAO-002
      parameters:
        - name: preferenceType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PreferenceType'
        - name: sourceType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SourceType'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/recipients/{recipientId}/preferences/bulk:
    parameters:
      - $ref: '#/components/parameters/RecipientId'
    post:
      tags: [Preference]
      summary: PREF-002 승인된 카카오 추출 취향 일괄 저장
      description: |
        카카오 분석 검토 화면에서 승인한 항목만 저장합니다.
        sourceType 은 생략할 수 있고, 보낸다면 KAKAO 여야 합니다. 생략하면 서버가 KAKAO 로 설정합니다.
      operationId: createPreferencesBulk
      x-uc-id: UC6
      x-req-id: REQ-F-006
      x-screen-id: SCR-KAKAO-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceBulkCreateRequest'
      responses:
        '201':
          description: 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/preferences/{preferenceId}:
    parameters:
      - $ref: '#/components/parameters/PreferenceId'
    patch:
      tags: [Preference]
      summary: PREF-004 취향 수정
      operationId: updatePreference
      x-uc-id: UC6
      x-req-id: REQ-F-006
      x-screen-id: SCR-KAKAO-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredPreference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Preference]
      summary: PREF-005 취향 삭제
      description: 저장된 취향은 항상 추천 콘텍스트에 포함되므로, 사용 중지는 삭제로 처리합니다.
      operationId: deletePreference
      x-uc-id: UC6
      x-req-id: REQ-F-006
      x-screen-id: SCR-KAKAO-002
      responses:
        '204':
          description: 삭제 성공
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/recipients/{recipientId}/kakao-analysis:
    parameters:
      - $ref: '#/components/parameters/RecipientId'
    post:
      tags: [KakaoAnalysis]
      summary: KAKAO-001 카카오톡 대화 파일 임시 분석
      description: |
        원문은 분석 완료 또는 실패 후 폐기하며 DB 에 저장하지 않습니다.
        허용 확장자는 txt, csv 이고 최대 크기는 5MB 입니다.
        응답 항목은 아직 저장되지 않은 후보이며 preferenceId 가 없습니다.
      operationId: analyzeKakaoConversation
      x-uc-id: UC4,UC5
      x-req-id: REQ-F-004,REQ-F-005
      x-screen-id: SCR-KAKAO-001
      requestBody:
