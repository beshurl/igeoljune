        giftName: 텀블러
        giftCategory: LIVING
        giftedAt: '2025-09-20'
        note: 지난 생일에 선물

    PreviousGiftUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        giftName:
          type: string
          minLength: 1
          maxLength: 255
        giftCategory:
          type: string
          maxLength: 100
          nullable: true
        giftedAt:
          type: string
          format: date
          nullable: true
        note:
          type: string
          nullable: true

    PreviousGift:
      type: object
      x-db-table: previous_gifts
      required: [previousGiftId, recipientId, giftName, createdAt, updatedAt]
      properties:
        previousGiftId:
          type: integer
          format: int64
        recipientId:
          type: integer
          format: int64
        giftName:
          type: string
          maxLength: 255
        giftCategory:
          type: string
          maxLength: 100
          nullable: true
        giftedAt:
          type: string
          format: date
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        previousGiftId: 7
        recipientId: 12
        giftName: 텀블러
        giftCategory: LIVING
        giftedAt: '2025-09-20'
        note: 지난 생일에 선물
        createdAt: '2026-09-03T14:30:00+09:00'
        updatedAt: '2026-09-03T14:30:00+09:00'

    PreviousGiftListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreviousGift'
        totalCount:
          type: integer
          format: int64
          minimum: 0
      example:
        items:
          - previousGiftId: 7
            recipientId: 12
            giftName: 텀블러
            giftCategory: LIVING
            giftedAt: '2025-09-20'
            note: 지난 생일에 선물
            createdAt: '2026-09-03T14:30:00+09:00'
            updatedAt: '2026-09-03T14:30:00+09:00'
        totalCount: 1

    GiftConditionCreateRequest:
      type: object
      required: [budgetMin, budgetMax, occasionType]
      additionalProperties: false
      properties:
        budgetMin:
          type: integer
          minimum: 0
        budgetMax:
          type: integer
          minimum: 0
        occasionType:
          type: string
          minLength: 1
          maxLength: 100
        occasionDate:
          type: string
          format: date
          nullable: true
        preferenceNote:
          type: string
          nullable: true
        avoidGiftNote:
          type: string
          nullable: true
      example:
        budgetMin: 30000
        budgetMax: 70000
        occasionType: BIRTHDAY
        occasionDate: '2026-09-20'
        preferenceNote: 실용적인 상품을 추천해 주세요.
        avoidGiftNote: 전자기기는 제외해 주세요.

    GiftConditionUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        budgetMin:
          type: integer
          minimum: 0
        budgetMax:
          type: integer
          minimum: 0
        occasionType:
          type: string
          minLength: 1
          maxLength: 100
        occasionDate:
          type: string
          format: date
          nullable: true
        preferenceNote:
          type: string
          nullable: true
        avoidGiftNote:
          type: string
          nullable: true

    GiftCondition:
      type: object
      x-db-table: gift_conditions
      required: [conditionId, recipientId, budgetMin, budgetMax, occasionType, createdAt, updatedAt]
      properties:
        conditionId:
          type: integer
          format: int64
        recipientId:
          type: integer
          format: int64
        budgetMin:
          type: integer
          minimum: 0
        budgetMax:
          type: integer
          minimum: 0
        occasionType:
          type: string
          maxLength: 100
        occasionDate:
          type: string
          format: date
          nullable: true
        preferenceNote:
          type: string
          nullable: true
        avoidGiftNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        conditionId: 3
        recipientId: 12
        budgetMin: 30000
        budgetMax: 70000
        occasionType: BIRTHDAY
        occasionDate: '2026-09-20'
        preferenceNote: 실용적인 상품을 추천해 주세요.
        avoidGiftNote: 전자기기는 제외해 주세요.
        createdAt: '2026-09-03T14:30:00+09:00'
        updatedAt: '2026-09-03T14:30:00+09:00'

    RecommendationStatus:
      type: string
      description: |
        추천 실행 상태. 동기 계약에서는 응답 시점에 항상 SUCCESS 입니다.
        PROCESSING 은 실행 직후의 내부 초기 상태이고, 실패는 422 로 롤백되므로 FAILED 가 응답에 나오지 않습니다.
        비동기 전환을 대비해 스키마에 유지합니다.
      enum: [PROCESSING, SUCCESS, FAILED]

    RecommendationSummary:
      type: object
      x-db-table: recommendations
      description: RECOMMEND-003 목록 항목. 후보를 포함하지 않습니다.
      required: [recommendationId, conditionId, status, createdAt, updatedAt]
      properties:
        recommendationId:
          type: integer
          format: int64
        conditionId:
          type: integer
          format: int64
        previousRecommendationId:
          type: integer
          format: int64
          nullable: true
        status:
          $ref: '#/components/schemas/RecommendationStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        recommendationId: 10
        conditionId: 3
        previousRecommendationId: null
        status: SUCCESS
        createdAt: '2026-09-03T14:30:00+09:00'
        updatedAt: '2026-09-03T14:30:00+09:00'

    RecommendationListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationSummary'
        totalCount:
          type: integer
          format: int64
          minimum: 0
      example:
        items:
          - recommendationId: 11
            conditionId: 3
            previousRecommendationId: 10
            status: SUCCESS
            createdAt: '2026-09-03T14:35:00+09:00'
            updatedAt: '2026-09-03T14:35:00+09:00'
          - recommendationId: 10
            conditionId: 3
            previousRecommendationId: null
            status: SUCCESS
            createdAt: '2026-09-03T14:30:00+09:00'
            updatedAt: '2026-09-03T14:30:07+09:00'
        totalCount: 2

    GiftCandidate:
      type: object
      x-db-table: recommendation_candidates
      description: |
        AI 추천 후보. giftName / recommendationReason / recommendRank 는 항상 채워지고,
        나머지 AI 출력 필드는 모델이 생략할 수 있어 null 을 허용합니다.
      required: [candidateId, giftName, recommendationReason, recommendRank, createdAt]
      properties:
        candidateId:
          type: integer
          format: int64
          x-db-field: candidate_id
        giftName:
          type: string
          minLength: 1
          maxLength: 255
          x-ai-output-field: true
          x-db-field: gift_name
        giftCategory:
          type: string
          maxLength: 100
          nullable: true
          x-ai-output-field: true
          x-db-field: gift_category
        estimatedPriceMin:
          type: integer
          minimum: 0
          nullable: true
          x-ai-output-field: true
          x-db-field: estimated_price_min
        estimatedPriceMax:
          type: integer
          minimum: 0
          nullable: true
          x-ai-output-field: true
          x-db-field: estimated_price_max
        recommendationReason:
          type: string
          minLength: 1
          x-ai-output-field: true
          x-db-field: recommendation_reason
        consideredInfo:
          type: string
          description: 추천 시점의 설명용 불변 스냅샷이며 정규화된 원본 데이터가 아닙니다. 검색·수정 기준으로 사용하지 않습니다.
          nullable: true
          x-ai-output-field: true
          x-db-field: considered_info
        cautionNote:
          type: string
          nullable: true
          x-ai-output-field: true
          x-db-field: caution_note
        recommendRank:
          type: integer
          minimum: 1
          description: 동일 추천 실행 안에서 후보를 노출하는 순위입니다. 1부터 시작합니다.
          x-ai-output-field: true
          x-db-field: recommend_rank
        createdAt:
          type: string
          format: date-time
          x-db-field: created_at
        selectedAt:
          type: string
          format: date-time
          description: 최종 선물로 선택한 시각. 선택하지 않았으면 null 이며 한 추천 실행 안에서 최대 1건만 값을 가집니다.
          nullable: true
          x-db-field: selected_at
        feedback:
          type: object
          description: 후보에 등록된 현재 피드백. 없으면 null 입니다.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Feedback'
      example:
        candidateId: 101
        giftName: 커피 드립 세트
        giftCategory: HOME_CAFE
        estimatedPriceMin: 40000
        estimatedPriceMax: 60000
        recommendationReason: 홈카페 취향과 생일 상황을 함께 고려했습니다.
        consideredInfo: 홈카페, 생일, 3~7만 원 예산
        cautionNote: 이미 보유한 드립 도구가 있는지 확인해 주세요.
        recommendRank: 1
        createdAt: '2026-09-03T14:30:10+09:00'
        selectedAt: null
        feedback:
          feedbackId: 51
          candidateId: 101
          feedbackType: LIKE
          dislikeReason: null
          createdAt: '2026-09-03T14:32:00+09:00'
          updatedAt: '2026-09-03T14:32:00+09:00'

    RecommendationFailure:
      type: object
      description: status = FAILED 일 때만 채워집니다. code 는 ErrorResponse 와 같은 체계를 씁니다.
      required: [code, message]
      properties:
        code:
          type: string
          maxLength: 50
        message:
          type: string
      example:
        code: AI_RESULT_INVALID
        message: AI 결과를 구조화하지 못했습니다.

    RecommendationDetail:
      type: object
      x-db-table: recommendations
      required: [recommendationId, conditionId, status, createdAt, updatedAt, candidates]
      properties:
        recommendationId:
          type: integer
          format: int64
        conditionId:
          type: integer
          format: int64
        previousRecommendationId:
          type: integer
          format: int64
          nullable: true
        status:
          $ref: '#/components/schemas/RecommendationStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        failure:
          type: object
          description: status = FAILED 일 때만 채워지고, 그 외에는 null 입니다.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/RecommendationFailure'
        candidates:
          type: array
          description: recommendRank 오름차순입니다.
          items:
            $ref: '#/components/schemas/GiftCandidate'
      example:
        recommendationId: 10
        conditionId: 3
        previousRecommendationId: null
        status: SUCCESS
        createdAt: '2026-09-03T14:30:00+09:00'
        updatedAt: '2026-09-03T14:30:07+09:00'
        failure: null
        candidates:
