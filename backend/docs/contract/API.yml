openapi: 3.0.3
info:
  title: 이걸주네? API
  version: 1.0.0
  description: |
    AI 맞춤형 선물 추천 서비스의 MVP REST API 명세입니다.
    일반 이메일·비밀번호 회원가입과 로그인을 사용합니다.
    카카오톡 원문은 분석 중에만 임시 처리하고 영구 저장하지 않습니다.
  contact:
    name: 이걸주네? 프로젝트 팀
    url: https://github.com/beshurl/igeoljune
  license:
    name: All rights reserved
    url: https://github.com/beshurl/igeoljune

servers:
  - url: /
    description: 배포 호스트와 로컬·Mock 호스트에 공통으로 적용하는 루트 URL

x-local-server: http://127.0.0.1:8080/api/v1
x-mock-server: http://127.0.0.1:4010/api/v1
x-mock-command: npx --yes @stoplight/prism-cli mock API.yml --host 127.0.0.1 --port 4010 --errors

tags:
  - name: Auth
    description: 이메일 회원가입·로그인
  - name: Users
    description: 현재 사용자 관리
  - name: Recipients
    description: 선물 대상 관리
  - name: Preferences
    description: 구조화 취향 관리
  - name: Kakao Analysis
    description: 카카오톡 대화 파일 임시 분석
  - name: Previous Gifts
    description: 대상별 과거 선물 관리
  - name: Gift Conditions
    description: 추천 조건 관리
  - name: Recommendations
    description: AI 추천·재추천
  - name: Feedback
    description: 후보별 현재 피드백

security:
  - bearerAuth: []

paths:
  /api/v1/auth/signup:
    post:
      tags: [Auth]
      summary: 이메일 회원가입
      operationId: signUp
      security: []
      x-uc-id: UC1
      x-req-id: REQ-F-001
      x-screen-id: SCR-AUTH-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              email: user@example.com
              password: password123!
              name: 홍길동
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: 이메일·비밀번호 로그인
      operationId: login
      security: []
      x-uc-id: UC1
      x-req-id: REQ-F-001
      x-screen-id: SCR-AUTH-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: user@example.com
              password: password123!
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: 내 정보 조회
      operationId: getMe
      x-uc-id: UC1
      x-req-id: REQ-F-001
      x-screen-id: SCR-AUTH-001
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Users]
      summary: 내 이름 수정
      operationId: updateMe
      x-uc-id: UC1
      x-req-id: REQ-F-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Users]
      summary: 회원 탈퇴
      description: 사용자와 소유한 추천 대상 및 하위 개인 데이터를 함께 삭제합니다.
      operationId: deleteMe
      x-uc-id: UC1
      x-req-id: REQ-F-001
      responses:
        '204':
          description: 탈퇴 성공
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/recipients:
    post:
      tags: [Recipients]
      summary: 추천 대상 등록
      operationId: createRecipient
      x-uc-id: UC2
      x-req-id: REQ-F-002
      x-screen-id: SCR-RECIPIENT-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      tags: [Recipients]
      summary: 추천 대상 목록 조회
      operationId: listRecipients
      x-uc-id: UC2
      x-req-id: REQ-F-002
      x-screen-id: SCR-RECIPIENT-001
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/recipients/{recipientId}:
    parameters:
      - $ref: '#/components/parameters/RecipientId'
    get:
      tags: [Recipients]
      summary: 추천 대상 상세 조회
      operationId: getRecipient
      x-uc-id: UC2
      x-req-id: REQ-F-002
      x-screen-id: SCR-RECIPIENT-001
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Recipients]
      summary: 추천 대상 수정
      operationId: updateRecipient
      x-uc-id: UC2
      x-req-id: REQ-F-002
      x-screen-id: SCR-RECIPIENT-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecipientUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Recipients]
      summary: 추천 대상 삭제
      operationId: deleteRecipient
      x-uc-id: UC2
      x-req-id: REQ-F-002
      x-screen-id: SCR-RECIPIENT-001
      responses:
        '204':
          description: 삭제 성공
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recipients/{recipientId}/preferences:
    parameters:
      - $ref: '#/components/parameters/RecipientId'
    post:
      tags: [Preferences]
      summary: 직접 입력 취향 등록
      description: sourceType은 서버에서 DIRECT로 설정합니다.
      operationId: createPreference
      x-uc-id: UC3
      x-req-id: REQ-F-003
      x-screen-id: SCR-GIFT-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredPreference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Preferences]
      summary: 취향 목록 조회
      operationId: listPreferences
      x-uc-id: UC3,UC6
      x-req-id: REQ-F-003,REQ-F-006
      x-screen-id: SCR-GIFT-001,SCR-KAKAO-002
      parameters:
        - name: preferenceType
          in: query
          schema:
            $ref: '#/components/schemas/PreferenceType'
        - name: sourceType
          in: query
          schema:
            $ref: '#/components/schemas/SourceType'
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recipients/{recipientId}/preferences/bulk:
    parameters:
      - $ref: '#/components/parameters/RecipientId'
    post:
      tags: [Preferences]
      summary: 승인된 카카오 추출 취향 일괄 저장
      description: 카카오 분석 검토 화면에서 승인한 항목만 저장하며 sourceType은 서버가 KAKAO로 설정합니다.
      operationId: createPreferencesBulk
      x-uc-id: UC6
      x-req-id: REQ-F-006
      x-screen-id: SCR-KAKAO-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceBulkCreateRequest'
      responses:
        '201':
          description: 저장 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreferenceListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/preferences/{preferenceId}:
    parameters:
      - $ref: '#/components/parameters/PreferenceId'
    patch:
      tags: [Preferences]
      summary: 취향 수정
      operationId: updatePreference
      x-uc-id: UC6
      x-req-id: REQ-F-006
      x-screen-id: SCR-KAKAO-002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenceUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuredPreference'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Preferences]
      summary: 취향 삭제
      operationId: deletePreference
      x-uc-id: UC6
      x-req-id: REQ-F-006
      x-screen-id: SCR-KAKAO-002
      responses:
        '204':
          description: 삭제 성공
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recipients/{recipientId}/kakao-analysis:
    parameters:
      - $ref: '#/components/parameters/RecipientId'
    post:
      tags: [Kakao Analysis]
      summary: 카카오톡 대화 파일 임시 분석
      description: 원문은 분석 완료 또는 실패 후 폐기하며 DB에 저장하지 않습니다.
      operationId: analyzeKakaoConversation
      x-uc-id: UC4,UC5
      x-req-id: REQ-F-004,REQ-F-005
      x-screen-id: SCR-KAKAO-001
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 카카오톡 대화 내보내기 파일
      responses:
        '200':
          description: 분석 성공. 아직 DB에 저장되지 않은 후보입니다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaoAnalysisResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/recipients/{recipientId}/previous-gifts:
    parameters:
      - $ref: '#/components/parameters/RecipientId'
    post:
      tags: [Previous Gifts]
      summary: 과거 선물 등록
      operationId: createPreviousGift
      x-uc-id: UC11
      x-req-id: REQ-F-011
      x-screen-id: SCR-HISTORY-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviousGiftCreateRequest'
      responses:
        '201':
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviousGift'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Previous Gifts]
      summary: 과거 선물 목록 조회
      operationId: listPreviousGifts
      x-uc-id: UC11
      x-req-id: REQ-F-011
      x-screen-id: SCR-HISTORY-001
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviousGiftListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/previous-gifts/{previousGiftId}:
    parameters:
      - $ref: '#/components/parameters/PreviousGiftId'
    patch:
      tags: [Previous Gifts]
      summary: 과거 선물 수정
      operationId: updatePreviousGift
      x-uc-id: UC11
      x-req-id: REQ-F-011
      x-screen-id: SCR-HISTORY-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviousGiftUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviousGift'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Previous Gifts]
      summary: 과거 선물 삭제
      operationId: deletePreviousGift
      x-uc-id: UC11
      x-req-id: REQ-F-011
      x-screen-id: SCR-HISTORY-001
      responses:
        '204':
          description: 삭제 성공
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recipients/{recipientId}/gift-conditions:
    parameters:
      - $ref: '#/components/parameters/RecipientId'
    post:
      tags: [Gift Conditions]
      summary: 추천 조건 생성
      operationId: createGiftCondition
      x-uc-id: UC3
      x-req-id: REQ-F-003
      x-screen-id: SCR-GIFT-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftConditionCreateRequest'
      responses:
        '201':
          description: 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCondition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/gift-conditions/{conditionId}:
    parameters:
      - $ref: '#/components/parameters/ConditionId'
    get:
      tags: [Gift Conditions]
      summary: 추천 조건 조회
      operationId: getGiftCondition
      x-uc-id: UC3
      x-req-id: REQ-F-003
      x-screen-id: SCR-GIFT-001
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCondition'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Gift Conditions]
      summary: 추천 조건 수정
      description: 보낸 필드만 수정합니다. 추천 실행이 시작된 조건의 수정 허용 여부는 구현 정책으로 확정해야 합니다.
      operationId: updateGiftCondition
      x-uc-id: UC3
      x-req-id: REQ-F-003
      x-screen-id: SCR-GIFT-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftConditionUpdateRequest'
      responses:
        '200':
          description: 수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftCondition'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Gift Conditions]
      summary: 추천 조건 삭제
      description: 연결된 추천 실행이 있으면 오조작 방지를 위해 409를 반환합니다.
      operationId: deleteGiftCondition
      x-uc-id: UC3
      x-req-id: REQ-F-003
      x-screen-id: SCR-GIFT-001
      responses:
        '204':
          description: 삭제 성공
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/gift-conditions/{conditionId}/recommendations:
    parameters:
      - $ref: '#/components/parameters/ConditionId'
    post:
      tags: [Recommendations]
      summary: AI 추천 요청
      description: 비동기 실행을 생성하고 PROCESSING 상태를 반환합니다.
      operationId: createRecommendation
      x-uc-id: UC7
      x-req-id: REQ-F-007
      x-screen-id: SCR-GIFT-001
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 추천 요청 접수
          headers:
            Location:
              description: 추천 상태 조회 URI
              schema:
                type: string
                example: /api/v1/recommendations/10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    get:
      tags: [Recommendations]
      summary: 조건별 추천 실행 목록 조회
      operationId: listRecommendations
      x-uc-id: UC8
      x-req-id: REQ-F-008
      x-screen-id: SCR-AI-001
      responses:
        '200':
          description: 생성일 역순 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recommendations/{recommendationId}:
    parameters:
      - $ref: '#/components/parameters/RecommendationId'
    get:
      tags: [Recommendations]
      summary: AI 추천 상태·결과 조회
      description: PROCESSING이면 candidates가 빈 배열이고, SUCCESS이면 후보를 반환합니다.
      operationId: getRecommendation
      x-uc-id: UC8
      x-req-id: REQ-F-008
      x-screen-id: SCR-AI-001
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/recommendations/{recommendationId}/re-recommend:
    parameters:
      - $ref: '#/components/parameters/RecommendationId'
    post:
      tags: [Recommendations]
      summary: 피드백 반영 재추천
      description: 같은 conditionId로 새 recommendation을 만들고 previousRecommendationId에 직전 실행을 기록합니다.
      operationId: createRerecommendation
      x-uc-id: UC10
      x-req-id: REQ-F-010
      x-screen-id: SCR-AI-002
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 재추천 요청 접수
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/recommendation-candidates/{candidateId}/feedback:
    parameters:
      - $ref: '#/components/parameters/CandidateId'
    put:
      tags: [Feedback]
      summary: 피드백 등록·변경
      description: 후보당 현재 피드백 한 건을 upsert합니다.
      operationId: upsertFeedback
      x-uc-id: UC9
      x-req-id: REQ-F-009
      x-screen-id: SCR-AI-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackUpsertRequest'
            examples:
              like:
                summary: 좋아요
                value:
                  feedbackType: LIKE
              dislike:
                summary: 싫어요
                value:
                  feedbackType: DISLIKE
                  dislikeReason: ALREADY_OWNED
      responses:
        '200':
          description: 등록 또는 변경 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Feedback]
      summary: 피드백 조회
      operationId: getFeedback
      x-uc-id: UC9
      x-req-id: REQ-F-009
      x-screen-id: SCR-AI-001
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Feedback]
      summary: 피드백 취소
      operationId: deleteFeedback
      x-uc-id: UC9
      x-req-id: REQ-F-009
      x-screen-id: SCR-AI-001
      responses:
        '204':
          description: 취소 성공
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RecipientId:
      name: recipientId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 12
    PreferenceId:
      name: preferenceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 31
    PreviousGiftId:
      name: previousGiftId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 7
    ConditionId:
      name: conditionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 10
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 101
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 동일 추천 요청의 중복 실행 방지용 UUID. 서버 지원 여부를 구현 전에 확정합니다.
      schema:
        type: string
        format: uuid
      example: 1a2709a2-e8c4-4a9b-a765-3e0406626974
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 입력값 검증 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: 입력값을 확인해 주세요.
            fieldErrors:
              - field: budgetMax
                reason: budgetMin 이상이어야 합니다.
    Unauthorized:
      description: 인증 토큰 누락·만료 또는 로그인 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: 인증이 필요합니다.
            fieldErrors: []
    Forbidden:
      description: 다른 사용자의 리소스 접근
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_FORBIDDEN
            message: 접근할 수 없는 리소스입니다.
            fieldErrors: []
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_NOT_FOUND
            message: 요청한 리소스를 찾을 수 없습니다.
            fieldErrors: []
    Conflict:
      description: 이메일·중복 데이터·리소스 상태 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_CONFLICT
            message: 현재 상태에서는 요청을 처리할 수 없습니다.
            fieldErrors: []
    PayloadTooLarge:
      description: 업로드 파일 허용 크기 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: 지원하지 않는 파일 형식
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: AI 분석 또는 추천 결과 처리 불가
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AI_RESULT_INVALID
            message: AI 결과를 구조화하지 못했습니다.
            fieldErrors: []

  schemas:
    User:
      type: object
      required: [userId, email, name, createdAt, updatedAt]
      properties:
        userId:
          type: integer
          format: int64
          readOnly: true
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      example:
        userId: 1
        email: user@example.com
        name: 홍길동
        createdAt: '2026-09-03T14:30:00+09:00'
        updatedAt: '2026-09-03T14:30:00+09:00'

    SignUpRequest:
      type: object
      required: [email, password, name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        name:
          type: string
          minLength: 1
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT Access Token 예시이며 실제 비밀값이 아닙니다.
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: 초 단위 만료 시간
        user:
          $ref: '#/components/schemas/User'
      example:
        accessToken: mock.access.token
        tokenType: Bearer
        expiresIn: 3600
        user:
          userId: 1
          email: user@example.com
          name: 홍길동
          createdAt: '2026-09-03T14:30:00+09:00'
          updatedAt: '2026-09-03T14:30:00+09:00'

    UpdateMeRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      example:
        name: 수정된 이름

    RecipientCreateRequest:
      type: object
      required: [name, relationship, ageGroup, gender]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        relationship:
          type: string
          minLength: 1
          maxLength: 50
        ageGroup:
          type: string
          minLength: 1
          maxLength: 30
        gender:
          type: string
          minLength: 1
          maxLength: 20
        job:
          type: string
          maxLength: 100
          nullable: true
      example:
        name: 철수
        relationship: FRIEND
        ageGroup: LATE_20S
        gender: MALE
        job: 개발자

    RecipientUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        relationship:
          type: string
          maxLength: 50
        ageGroup:
          type: string
          maxLength: 30
        gender:
          type: string
          maxLength: 20
        job:
          type: string
          maxLength: 100
          nullable: true

    Recipient:
      type: object
      required: [recipientId, name, relationship, ageGroup, gender, createdAt, updatedAt]
      properties:
        recipientId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          minLength: 1
          maxLength: 100
        relationship:
          type: string
          maxLength: 50
        ageGroup:
          type: string
          maxLength: 30
        gender:
          type: string
          maxLength: 20
        job:
          type: string
          maxLength: 100
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      example:
        recipientId: 12
        name: 철수
        relationship: FRIEND
        ageGroup: LATE_20S
        gender: MALE
        job: 개발자
        createdAt: '2026-09-03T14:30:00+09:00'
        updatedAt: '2026-09-03T14:30:00+09:00'

    RecipientListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        totalCount:
          type: integer
          minimum: 0
      example:
        items:
          - recipientId: 12
            name: 철수
            relationship: FRIEND
            ageGroup: LATE_20S
            gender: MALE
            job: 개발자
            createdAt: '2026-09-03T14:30:00+09:00'
            updatedAt: '2026-09-03T14:30:00+09:00'
        totalCount: 1

    PreferenceType:
      type: string
      enum: [INTEREST, PREFERRED_CATEGORY, PREFERRED_ATTRIBUTE, DISLIKED_CATEGORY, WISH_ITEM]
    SourceType:
      type: string
      enum: [DIRECT, KAKAO]

    PreferenceCreateRequest:
      type: object
      required: [preferenceType, preferenceValue]
      additionalProperties: false
      properties:
        preferenceType:
          $ref: '#/components/schemas/PreferenceType'
        preferenceValue:
          type: string
          minLength: 1
          maxLength: 255
      example:
        preferenceType: INTEREST
        preferenceValue: 러닝

    PreferenceUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        preferenceType:
          $ref: '#/components/schemas/PreferenceType'
        preferenceValue:
          type: string
          minLength: 1
          maxLength: 255

    PreferenceBulkCreateRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PreferenceCreateRequest'
      example:
        items:
          - preferenceType: INTEREST
            preferenceValue: 홈카페
          - preferenceType: DISLIKED_CATEGORY
            preferenceValue: 향수

    StructuredPreference:
      type: object
      required: [preferenceId, recipientId, preferenceType, preferenceValue, sourceType, createdAt, updatedAt]
      properties:
        preferenceId:
          type: integer
          format: int64
        recipientId:
          type: integer
          format: int64
        preferenceType:
          $ref: '#/components/schemas/PreferenceType'
        preferenceValue:
          type: string
        sourceType:
          $ref: '#/components/schemas/SourceType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        preferenceId: 31
        recipientId: 12
        preferenceType: INTEREST
        preferenceValue: 홈카페
        sourceType: KAKAO
        createdAt: '2026-09-03T14:31:00+09:00'
        updatedAt: '2026-09-03T14:31:00+09:00'

    PreferenceListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StructuredPreference'
        totalCount:
          type: integer
          minimum: 0
      example:
        items:
          - preferenceId: 31
            recipientId: 12
            preferenceType: INTEREST
            preferenceValue: 홈카페
            sourceType: KAKAO
            createdAt: '2026-09-03T14:31:00+09:00'
            updatedAt: '2026-09-03T14:31:00+09:00'
        totalCount: 1

    KakaoAnalysisItem:
      type: object
      required: [preferenceType, preferenceValue]
      properties:
        preferenceType:
          $ref: '#/components/schemas/PreferenceType'
        preferenceValue:
          type: string
    KakaoAnalysisResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KakaoAnalysisItem'
      example:
        items:
          - preferenceType: INTEREST
            preferenceValue: 홈카페
          - preferenceType: WISH_ITEM
            preferenceValue: 무선 충전기

    PreviousGiftCreateRequest:
      type: object
      required: [giftName]
      additionalProperties: false
      properties:
        giftName:
          type: string
          minLength: 1
          maxLength: 255
        giftCategory:
          type: string
          maxLength: 100
          nullable: true
        giftedAt:
          type: string
          format: date
          nullable: true
        note:
          type: string
          nullable: true
      example:
        giftName: 텀블러
        giftCategory: LIVING
        giftedAt: '2025-09-20'
        note: 지난 생일에 선물

    PreviousGiftUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        giftName:
          type: string
          minLength: 1
          maxLength: 255
        giftCategory:
          type: string
          maxLength: 100
          nullable: true
        giftedAt:
          type: string
          format: date
          nullable: true
        note:
          type: string
          nullable: true

    PreviousGift:
      type: object
      required: [previousGiftId, recipientId, giftName, createdAt, updatedAt]
      properties:
        previousGiftId:
          type: integer
          format: int64
        recipientId:
          type: integer
          format: int64
        giftName:
          type: string
        giftCategory:
          type: string
          nullable: true
        giftedAt:
          type: string
          format: date
          nullable: true
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        previousGiftId: 7
        recipientId: 12
        giftName: 텀블러
        giftCategory: LIVING
        giftedAt: '2025-09-20'
        note: 지난 생일에 선물
        createdAt: '2026-09-03T14:30:00+09:00'
        updatedAt: '2026-09-03T14:30:00+09:00'

    PreviousGiftListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreviousGift'
        totalCount:
          type: integer
          minimum: 0
      example:
        items:
          - previousGiftId: 7
            recipientId: 12
            giftName: 텀블러
            giftCategory: LIVING
            giftedAt: '2025-09-20'
            note: 지난 생일에 선물
            createdAt: '2026-09-03T14:30:00+09:00'
            updatedAt: '2026-09-03T14:30:00+09:00'
        totalCount: 1

    GiftConditionCreateRequest:
      type: object
      required: [budgetMin, budgetMax, occasionType]
      additionalProperties: false
      properties:
        budgetMin:
          type: integer
          minimum: 0
        budgetMax:
          type: integer
          minimum: 0
        occasionType:
          type: string
          minLength: 1
          maxLength: 100
        occasionDate:
          type: string
          format: date
          nullable: true
        preferenceNote:
          type: string
          nullable: true
        avoidGiftNote:
          type: string
          nullable: true
      example:
        budgetMin: 30000
        budgetMax: 70000
        occasionType: BIRTHDAY
        occasionDate: '2026-09-20'
        preferenceNote: 실용적인 상품을 추천해 주세요.
        avoidGiftNote: 전자기기는 제외해 주세요.

    GiftConditionUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        budgetMin:
          type: integer
          minimum: 0
        budgetMax:
          type: integer
          minimum: 0
        occasionType:
          type: string
          maxLength: 100
        occasionDate:
          type: string
          format: date
          nullable: true
        preferenceNote:
          type: string
          nullable: true
        avoidGiftNote:
          type: string
          nullable: true

    GiftCondition:
      type: object
      required: [conditionId, recipientId, budgetMin, budgetMax, occasionType, createdAt, updatedAt]
      properties:
        conditionId:
          type: integer
          format: int64
        recipientId:
          type: integer
          format: int64
        budgetMin:
          type: integer
          minimum: 0
        budgetMax:
          type: integer
          minimum: 0
        occasionType:
          type: string
          maxLength: 100
        occasionDate:
          type: string
          format: date
          nullable: true
        preferenceNote:
          type: string
          nullable: true
        avoidGiftNote:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        conditionId: 3
        recipientId: 12
        budgetMin: 30000
        budgetMax: 70000
        occasionType: BIRTHDAY
        occasionDate: '2026-09-20'
        preferenceNote: 실용적인 상품을 추천해 주세요.
        avoidGiftNote: 전자기기는 제외해 주세요.
        createdAt: '2026-09-03T14:30:00+09:00'
        updatedAt: '2026-09-03T14:30:00+09:00'

    RecommendationStatus:
      type: string
      enum: [PROCESSING, SUCCESS, FAILED]

    RecommendationAccepted:
      type: object
      required: [recommendationId, conditionId, status, createdAt, updatedAt]
      properties:
        recommendationId:
          type: integer
          format: int64
        conditionId:
          type: integer
          format: int64
        previousRecommendationId:
          type: integer
          format: int64
          nullable: true
        status:
          $ref: '#/components/schemas/RecommendationStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        recommendationId: 10
        conditionId: 3
        previousRecommendationId: null
        status: PROCESSING
        createdAt: '2026-09-03T14:30:00+09:00'
        updatedAt: '2026-09-03T14:30:00+09:00'

    RecommendationSummary:
      $ref: '#/components/schemas/RecommendationAccepted'

    RecommendationListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RecommendationSummary'
        totalCount:
          type: integer
          minimum: 0
      example:
        items:
          - recommendationId: 11
            conditionId: 3
            previousRecommendationId: 10
            status: PROCESSING
            createdAt: '2026-09-03T14:35:00+09:00'
            updatedAt: '2026-09-03T14:35:00+09:00'
          - recommendationId: 10
            conditionId: 3
            previousRecommendationId: null
            status: SUCCESS
            createdAt: '2026-09-03T14:30:00+09:00'
            updatedAt: '2026-09-03T14:30:07+09:00'
        totalCount: 2

    GiftCandidate:
      type: object
      required: [candidateId, giftName, recommendationReason, recommendRank, createdAt]
      properties:
        candidateId:
          type: integer
          format: int64
        giftName:
          type: string
        giftCategory:
          type: string
          nullable: true
        estimatedPriceMin:
          type: integer
          minimum: 0
          nullable: true
        estimatedPriceMax:
          type: integer
          minimum: 0
          nullable: true
        recommendationReason:
          type: string
        consideredInfo:
          type: string
          nullable: true
          description: 추천 시점의 설명용 불변 스냅샷이며 정규화된 원본 데이터가 아닙니다.
        cautionNote:
          type: string
          nullable: true
        recommendRank:
          type: integer
          minimum: 1
          description: 동일 추천 결과 안에서 후보를 노출하는 추천 순위입니다. 1부터 시작합니다.
        createdAt:
          type: string
          format: date-time
        feedback:
          type: object
          allOf:
            - $ref: '#/components/schemas/Feedback'
          nullable: true
      example:
        candidateId: 101
        giftName: 커피 드립 세트
        giftCategory: HOME_CAFE
        estimatedPriceMin: 40000
        estimatedPriceMax: 60000
        recommendationReason: 홈카페 취향과 생일 상황을 함께 고려했습니다.
        consideredInfo: 홈카페, 생일, 3~7만 원 예산
