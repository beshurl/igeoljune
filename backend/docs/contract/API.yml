components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RecipientId:
      name: recipientId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 12
    PreferenceId:
      name: preferenceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 31
    PreviousGiftId:
      name: previousGiftId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 7
    ConditionId:
      name: conditionId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 3
    RecommendationId:
      name: recommendationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 10
    CandidateId:
      name: candidateId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 101
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: 입력값 검증 실패 또는 정의되지 않은 요청 필드
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: 입력값을 확인해 주세요.
            fieldErrors:
              - field: budgetMax
                reason: budgetMin 이상이어야 합니다.
    Unauthorized:
      description: 인증 토큰 누락·만료 또는 로그인 실패
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: 인증이 필요합니다.
            fieldErrors: []
    Forbidden:
      description: 다른 사용자의 리소스 접근
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_FORBIDDEN
            message: 접근할 수 없는 리소스입니다.
            fieldErrors: []
    NotFound:
      description: 리소스를 찾을 수 없음
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_NOT_FOUND
            message: 요청한 리소스를 찾을 수 없습니다.
            fieldErrors: []
    Conflict:
      description: 이메일·중복 데이터·리소스 상태 충돌
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: RESOURCE_CONFLICT
            message: 현재 상태에서는 요청을 처리할 수 없습니다.
            fieldErrors: []
    PayloadTooLarge:
      description: 업로드 파일 허용 크기(5MB) 초과
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: PAYLOAD_TOO_LARGE
            message: 허용 크기를 초과한 파일입니다.
            fieldErrors: []
    UnsupportedMediaType:
      description: 지원하지 않는 파일 형식 (txt, csv 만 허용)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNSUPPORTED_MEDIA_TYPE
            message: 지원하지 않는 파일 형식입니다.
            fieldErrors: []
    UnprocessableEntity:
      description: AI 분석 또는 추천 결과 처리 불가
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: AI_RESULT_INVALID
            message: AI 결과를 구조화하지 못했습니다.
            fieldErrors: []
    InternalServerError:
      description: 서버 내부 오류
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: 서버 내부 오류가 발생했습니다.
            fieldErrors: []

  schemas:
    User:
      type: object
      x-db-table: users
      required: [userId, email, name, createdAt, updatedAt]
      properties:
        userId:
          type: integer
          format: int64
          readOnly: true
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
          maxLength: 100
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      example:
        userId: 1
        email: user@example.com
        name: 홍길동
        createdAt: '2026-09-03T14:30:00+09:00'
        updatedAt: '2026-09-03T14:30:00+09:00'

    SignUpRequest:
      type: object
      required: [email, password, name]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        name:
          type: string
          minLength: 1
          maxLength: 100

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          format: password
          minLength: 1

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          description: JWT Access Token
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          description: 초 단위 만료 시간
        user:
          $ref: '#/components/schemas/User'
      example:
        accessToken: mock.access.token
        tokenType: Bearer
        expiresIn: 3600
        user:
          userId: 1
          email: user@example.com
          name: 홍길동
          createdAt: '2026-09-03T14:30:00+09:00'
          updatedAt: '2026-09-03T14:30:00+09:00'

    UpdateMeRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
      example:
        name: 수정된 이름

    RecipientCreateRequest:
      type: object
      required: [name, relationship, ageGroup, gender]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        relationship:
          type: string
          minLength: 1
          maxLength: 50
        ageGroup:
          type: string
          minLength: 1
          maxLength: 30
        gender:
          type: string
          minLength: 1
          maxLength: 20
        job:
          type: string
          maxLength: 100
          nullable: true
      example:
        name: 철수
        relationship: FRIEND
        ageGroup: LATE_20S
        gender: MALE
        job: 개발자

    RecipientUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      description: 보낸 필드만 수정합니다. 값을 보냈다면 공백일 수 없습니다.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        relationship:
          type: string
          minLength: 1
          maxLength: 50
        ageGroup:
          type: string
          minLength: 1
          maxLength: 30
        gender:
          type: string
          minLength: 1
          maxLength: 20
        job:
          type: string
          maxLength: 100
          nullable: true

    Recipient:
      type: object
      x-db-table: recipient
      required: [recipientId, name, relationship, ageGroup, gender, createdAt, updatedAt]
      properties:
        recipientId:
          type: integer
          format: int64
          readOnly: true
        name:
          type: string
          maxLength: 100
        relationship:
          type: string
          maxLength: 50
        ageGroup:
          type: string
          maxLength: 30
        gender:
          type: string
          maxLength: 20
        job:
          type: string
          maxLength: 100
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      example:
        recipientId: 12
        name: 철수
        relationship: FRIEND
        ageGroup: LATE_20S
        gender: MALE
        job: 개발자
        createdAt: '2026-09-03T14:30:00+09:00'
        updatedAt: '2026-09-03T14:30:00+09:00'

    RecipientListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        totalCount:
          type: integer
          format: int64
          minimum: 0
          description: 현재 페이지가 아니라 전체 건수
      example:
        items:
          - recipientId: 12
            name: 철수
            relationship: FRIEND
            ageGroup: LATE_20S
            gender: MALE
            job: 개발자
            createdAt: '2026-09-03T14:30:00+09:00'
            updatedAt: '2026-09-03T14:30:00+09:00'
        totalCount: 1

    PreferenceType:
      type: string
      enum: [INTEREST, PREFERRED_CATEGORY, PREFERRED_ATTRIBUTE, DISLIKED_CATEGORY, WISH_ITEM]
    SourceType:
      type: string
      enum: [DIRECT, KAKAO]

    PreferenceCreateRequest:
      type: object
      required: [preferenceType, preferenceValue]
      additionalProperties: false
      properties:
        preferenceType:
          $ref: '#/components/schemas/PreferenceType'
        preferenceValue:
          type: string
          minLength: 1
          maxLength: 255
      example:
        preferenceType: INTEREST
        preferenceValue: 러닝

    PreferenceUpdateRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        preferenceType:
          $ref: '#/components/schemas/PreferenceType'
        preferenceValue:
          type: string
          minLength: 1
          maxLength: 255

    PreferenceBulkCreateRequest:
      type: object
      required: [items]
      additionalProperties: false
      description: |
        sourceType 은 선택 필드입니다. 프론트와 Notion 명세서가 함께 보내므로 받아들이되,
        이 API 는 카카오 분석 검토 결과 전용이라 KAKAO 만 허용하고 생략하면 서버가 KAKAO 로 설정합니다.
      properties:
        sourceType:
          allOf:
            - $ref: '#/components/schemas/SourceType'
          description: 생략 가능. 보낸다면 KAKAO 여야 합니다.
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/PreferenceCreateRequest'
      example:
        sourceType: KAKAO
        items:
          - preferenceType: INTEREST
            preferenceValue: 홈카페
          - preferenceType: DISLIKED_CATEGORY
            preferenceValue: 향수

    StructuredPreference:
      type: object
      x-db-table: structured_preference
      required: [preferenceId, recipientId, preferenceType, preferenceValue, sourceType, createdAt, updatedAt]
      properties:
        preferenceId:
          type: integer
          format: int64
        recipientId:
          type: integer
          format: int64
        preferenceType:
          $ref: '#/components/schemas/PreferenceType'
        preferenceValue:
          type: string
          maxLength: 255
        sourceType:
          $ref: '#/components/schemas/SourceType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        preferenceId: 31
        recipientId: 12
        preferenceType: INTEREST
        preferenceValue: 홈카페
        sourceType: KAKAO
        createdAt: '2026-09-03T14:31:00+09:00'
        updatedAt: '2026-09-03T14:31:00+09:00'

    PreferenceListResponse:
      type: object
      required: [items, totalCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StructuredPreference'
        totalCount:
          type: integer
          format: int64
          minimum: 0
      example:
        items:
          - preferenceId: 31
            recipientId: 12
            preferenceType: INTEREST
            preferenceValue: 홈카페
            sourceType: KAKAO
            createdAt: '2026-09-03T14:31:00+09:00'
            updatedAt: '2026-09-03T14:31:00+09:00'
        totalCount: 1

    KakaoAnalysisItem:
      type: object
      description: 저장 전 상태라 preferenceId 가 없습니다.
      required: [preferenceType, preferenceValue]
      properties:
        preferenceType:
          $ref: '#/components/schemas/PreferenceType'
        preferenceValue:
          type: string

    KakaoAnalysisResponse:
      type: object
      description: 저장 전 분석 결과라 totalCount 를 포함하지 않습니다.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KakaoAnalysisItem'
      example:
        items:
          - preferenceType: INTEREST
            preferenceValue: 홈카페
          - preferenceType: WISH_ITEM
            preferenceValue: 무선 충전기

    PreviousGiftCreateRequest:
      type: object
      required: [giftName]
      additionalProperties: false
      properties:
        giftName:
          type: string
          minLength: 1
          maxLength: 255
        giftCategory:
          type: string
          maxLength: 100
          nullable: true
        giftedAt:
          type: string
          format: date
          nullable: true
        note:
          type: string
          nullable: true
